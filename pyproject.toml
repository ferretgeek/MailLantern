[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-lantern"
version = "1.0.2"
description = "A local-first, read-only iCloud verification-code finder."
readme = "README_EN.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ferretgeek" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ferretgeek/icloud-code-finder"
Issues = "https://github.com/ferretgeek/icloud-code-finder/issues"

[project.scripts]
mail-lantern = "mail_lantern.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_lantern = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
